parameters:
    locale: en_US
    secret: "Three can keep a secret, if two of them are dead."
    database_url: "sqlite:///%kernel.project_dir%/config/db.sql"

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $dataDir: '%kernel.project_dir%/config/data'

    App\:
        resource: '../src'
        # we do not use grids as service here
        exclude: '../src/Grid'
